name: Update Trophies

on:
  schedule:
    - cron: '0 0 * * *' # Se ejecuta automáticamente todos los días a medianoche
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Trophies SVG
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: leansandoval
          output_path: trophies.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update github trophies"
          file_pattern: trophies.svg