name: Update Trophies

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clean Existing Trophies File
        run: rm -rf ${{ github.workspace }}/github-trophies.svg

      - name: Download Custom Trophies SVG
        run: |
          curl -s "https://github-profile-trophy-fork-two.vercel.app/?username=leansandoval&theme=darkhub&no-bg=true&column=5" -o ${{ github.workspace }}/github-trophies.svg

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update github trophies"
          file_pattern: github-trophies.svg