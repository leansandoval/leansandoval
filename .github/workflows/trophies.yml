name: Update Trophies

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean existing trophies path
        run: rm -rf trophies.svg github-trophies.svg

      - name: Generate Trophies SVG
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: leansandoval
          output_path: github-trophies.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update github trophies"
          file_pattern: github-trophies.svg